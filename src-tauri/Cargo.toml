[package]
name = "rehab-bsbt91-game"
version = "0.1.0"
description = "BS-BT91 rehabilitation interaction demo"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "rehab_bsbt91_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.12"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = "1"
